name: ci-rerun
on:
  push:
    branches:
      - rerun/**
permissions:
  actions: write
jobs:
  rerun:
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the failed jobs of the release prep run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/cjber/skillup-forever/actions/runs/39912576564/rerun-failed-jobs
