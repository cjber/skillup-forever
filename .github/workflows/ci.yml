name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A manual run on any branch.
  workflow_dispatch:

permissions:
  contents: read

# PyPI answers 502/504 under load; pip's own retries cover it.
env:
  PIP_RETRIES: 5
  PIP_DEFAULT_TIMEOUT: 60

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deadcode:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/deadcode.py --check

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - run: luacheck .
      - run: python3 -m tools.forever_tools.assets
      - run: python3 -m tools.forever_tools.specs
      # forever_sim runs the addon under the client's real Blizzard UI source (tests/sim).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/sync.py check
      - run: python3 tools/forever_sim/fetch.py
      - run: luajit tools/forever_sim/run.lua
      # A screenshot older than the code it is drawn from (docs/screenshots/scenes.sha256).
      - run: python3 tools/check_screenshots.py
      # Every function Core/API.lua publishes is named in docs/api.md, with its minor history.
      - run: python3 tools/check_api_docs.py
      # The bench Speedpatrol times: it asserts nothing, so this proves it still runs to the end.
      - run: luajit tests/bench.lua
      - run: pipx run ruff==0.16.8 check tools
      - run: pipx run ruff==0.16.8 format --check tools
      - uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT"
      - name: Install LuaLS 3.19.1
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -sSfL -o "$RUNNER_TEMP/luals.tar.gz" https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          echo "e9235d2d72ef55bc41cf8c99cda2ed64777682024b4bb81f5dea425060c5cbb8  $RUNNER_TEMP/luals.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/luals"
          tar -xzf "$RUNNER_TEMP/luals.tar.gz" -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"
      - run: tools/typecheck.sh

  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - run: python3 tools/check_generated.py
      # Data/Credits.lua and the README and store thanks blocks are generated from THIRD_PARTY.md (WFA-31).
      - run: python3 tools/forever_tools/credits.py --check

  project-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release publishes its changelog entry, so every tagged version needs one.
      - run: python3 tools/changelog.py --check

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pipx run --spec actionlint-py==1.7.12.25 actionlint
      - run: pipx run zizmor==1.30.1 --offline .github

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks over the full history
        run: |
          curl --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 20 --max-time 300 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # What a tag would ship, checked before it ships: the release workflow's packager without uploading or zipping,
  # then tools/check_package.py on .release/ (every loaded file present, no development folders, specs pass on it).
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FOREVER_CORE: forever-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every commit and tag for the version, without old file contents.
          filter: blob:none
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua5.1=5.1.5-9build2"
      # .pkgmeta's manual changelog, which the release fills with the version's entry.
      - run: printf 'Package check\n' > .release-notes.md
      # The packager skips a push build when HEAD carries a tag ("Found future tag, not packaging"), so a tag that
      # lands while this run is in flight would fail this job and leave main without the green run a release starts
      # from. This job checks what a tag would ship, so hide HEAD's tags and let the dry run build what an ordinary
      # push to main builds.
      - name: Package this commit as an untagged build
        run: git tag --points-at HEAD | xargs -r git tag --delete
      - uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d -z
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache/forever_sim
          key: forever-sim-${{ hashFiles('tools/forever_sim/fetch.py') }}
      - run: python3 tools/forever_sim/fetch.py
      - run: python3 tools/check_package.py
