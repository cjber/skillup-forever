name: Refresh profession data

# Opens a PR with regenerated data when a generator pin has a newer upstream: the Forever or Classic
# Era build on wago.tools, or the LibPeriodicTable file a generator reads.
# The Lua checks run here first; GitHub holds the CI of a PR that GITHUB_TOKEN opened, so the ci job approves it.
# Daily: beta builds have shipped several times a week. A scheduled run that fails opens an issue.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      FOREVER_CORE: forever-core
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates with its own `token` input.
          persist-credentials: false
      - name: Read the ForeverCore ref
        id: forever-core-ref
        run: echo "ref=$(cat tools/forever-core.txt)" >> "$GITHUB_OUTPUT"
      - name: Check out ForeverCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cjber/forever-core
          ref: ${{ steps.forever-core-ref.outputs.ref }}
          path: forever-core
          persist-credentials: false
      # Pinned inputs CI already downloaded, such as frozen dumps; each file is keyed by its pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/.cache
          key: regeneration-${{ runner.os }}-${{ hashFiles('tools/gen_*.py') }}
          restore-keys: regeneration-${{ runner.os }}-
      - name: Pin the newest upstreams
        id: pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          moved=$(python3 tools/bump_pins.py)
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          if [ -z "$moved" ]; then
            echo "already on $(sed -n 's/^BUILD = "\(.*\)"/\1/p' tools/gen_thresholds.py) and every other newest pin"
          fi
      - if: steps.pins.outputs.moved != ''
        run: |
          python3 tools/gen_thresholds.py
          python3 tools/gen_vendor.py
          python3 tools/gen_recipes.py
          python3 tools/gen_trainer.py
          python3 tools/gen_sources.py
          python3 tools/check_generated.py --offline
      # Ubuntu 24.04's release-pocket builds, which the archive never replaces.
      - name: Install LuaJIT and luacheck
        if: steps.pins.outputs.moved != ''
        env:
          LUAJIT: 2.1.0+git20231223.c525bcb+dfsg-1
          LUACHECK: 1.1.2-1
        run: |
          # Fall back to a mirror of Ubuntu's signed archives when the runner's Azure mirror cannot resolve.
          mirror_list=/etc/apt/apt-mirrors.txt
          if [ -f "$mirror_list" ] && ! getent ahosts azure.archive.ubuntu.com >/dev/null; then
            printf '%s\n' https://mirrors.mit.edu/ubuntu | sudo tee "$mirror_list" >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades \
            "luajit=$LUAJIT" "libluajit-5.1-2=$LUAJIT" "libluajit-5.1-common=$LUAJIT" "lua-check=$LUACHECK"
      - if: steps.pins.outputs.moved != ''
        run: |
          luacheck .
          python3 -m tools.forever_tools.specs
      - if: steps.pins.outputs.moved != ''
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .
      - if: steps.pins.outputs.moved != ''
        id: report
        run: |
          {
            echo 'markdown<<REPORT_EOF'
            python3 tools/data_report.py
            echo REPORT_EOF
          } >> "$GITHUB_OUTPUT"
      - if: steps.pins.outputs.moved != ''
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: data/refresh
          title: "data: profession data for ${{ steps.pins.outputs.moved }}"
          commit-message: "data: profession data for ${{ steps.pins.outputs.moved }}"
          body: |
            A generator pin moved to its newest upstream: ${{ steps.pins.outputs.moved }}. All five `Data` files are regenerated; `tools/README.md` names each file's sources.

            - `Data/Thresholds.lua`, `Data/Recipes.lua` and `Data/Vendor.lua` come from the Forever build's own DB2 tables on wago.tools (skill ranges, reagents, outputs, prices and spell names), with LibPeriodicTable's list of vendor-sold reagents.
            - `Data/Trainer.lua` and `Data/Sources.lua` hold what QuestieDB and AtlasLoot do not: trainer fees and ranks, which trainer teaches a profession, a scroll's drop chances and which reagents a gathering skill yields. These come from the pinned CMaNGOS classic-db dump, which this workflow never moves, joined to Classic Era's teaching spells and limited to the recipes the Forever build has. Vendors, quests and where NPCs stand are read in game from the player's QuestieDB and AtlasLoot and are not regenerated.

            ${{ steps.report.outputs.markdown }}

            Before merging, read the diff for recipes that dropped out, and run `/skillup audit` in-game on a couple of professions to confirm the new values match the colours the client shows.

            The workflow that opened this PR also approved its CI, so the required checks run without a maintainer's approval.

  # GitHub holds every pull_request run on a PR that GITHUB_TOKEN opened until someone with write access approves
  # it: the held run has no jobs and no log, and it ends as a failure when the PR closes. Approve the PR commit's held
  # runs (CI and Speedpatrol) so its required checks run on their own. GitHub creates them a few seconds after the push.
  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - name: Approve the PR's held workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.refresh.outputs.sha }}
        run: |
          for _ in $(seq 30); do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&head_sha=$SHA" \
              --jq '.workflow_runs[] | "\(.id) \(.conclusion)"')
            held=$(printf '%s\n' "$runs" | awk '$2 == "action_required" { print $1 }')
            for id in $held; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" > /dev/null
              echo "Approved run $id"
            done
            if [ -n "$runs" ] && [ -z "$held" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The pull_request runs for $SHA were not created or not approved"
          exit 1

  # One open "Data refresh failed" issue: a scheduled run that fails again when retry-refresh.yml re-runs it
  # opens it or adds to it, and the next one that passes closes it.
  report:
    needs: [refresh, ci]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "Data refresh failed"' \
            --json number,title --jq '[.[] | select(.title == "Data refresh failed")][0].number // empty')
          if [ "$FAILED" = true ] && [ "$RUN_ATTEMPT" = 1 ]; then
            echo "retry-refresh.yml re-runs this once; only a failed re-run is reported"
          elif [ "$FAILED" = true ]; then
            body="The scheduled data refresh failed: $RUN_URL

          The bundled data stays on its old pins until this is fixed. Run \`python3 tools/bump_pins.py\` and the generators in \`tools/README.md\` to reproduce it."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "Data refresh failed" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The refresh passed again: $RUN_URL"
          fi
