name: Refresh profession data

# Opens a PR when wago.tools lists a newer Forever build whose recipe data differs, then runs CI
# on it: a PR opened with GITHUB_TOKEN triggers no pull_request workflows.
# Daily: beta builds have shipped several times a week.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch: ${{ steps.pr.outputs.pull-request-branch }}
      operation: ${{ steps.pr.outputs.pull-request-operation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # create-pull-request authenticates with its own `token` input.
          persist-credentials: false
      - name: Pin the newest Forever build
        id: build
        run: |
          build=$(python3 tools/latest_build.py)
          echo "version=$build" >> "$GITHUB_OUTPUT"
          if grep -q "^BUILD = \"$build\"" tools/gen_thresholds.py; then
            echo "already on $build"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new=true" >> "$GITHUB_OUTPUT"
          sed -i -E "s/^BUILD = \".*\"/BUILD = \"$build\"/; s/^SOURCE_DATE = \".*\"/SOURCE_DATE = \"$(date -u +%F)\"/" tools/gen_thresholds.py
      - if: steps.build.outputs.new == 'true'
        run: python3 tools/gen_thresholds.py && python3 tools/gen_vendor.py && python3 tools/gen_recipes.py && python3 tools/gen_trainer.py && python3 tools/gen_sources.py
      - if: steps.build.outputs.new == 'true'
        run: sudo apt-get update && sudo apt-get install -y luajit && luajit tests/model_spec.lua
      - if: steps.build.outputs.new == 'true'
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data/forever-${{ steps.build.outputs.version }}
          title: "data: thresholds, recipes and prices for Forever ${{ steps.build.outputs.version }}"
          commit-message: "data: thresholds, recipes and prices for Forever ${{ steps.build.outputs.version }}"
          body: |
            Regenerated `Data/Thresholds.lua`, `Data/Vendor.lua` and `Data/Recipes.lua` from the profession, reagent, output, price and spell-name DB2s of Forever build ${{ steps.build.outputs.version }}, and `Data/Trainer.lua` and `Data/Sources.lua` from CMaNGOS classic-db against that build.

            Before merging, run `/su audit` in-game on a couple of professions to confirm the new values match the colours the client shows.

  ci:
    needs: refresh
    if: needs.refresh.outputs.operation == 'created' || needs.refresh.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.refresh.outputs.branch }}
