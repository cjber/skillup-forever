[extend]
useDefault = true

# generic-api-key reads `local api = Auctionator.API.v1` in Shopping.lua, and the specs' stubbed
# `m.G.Auctionator.API.v1`, as a credential; it is the Auctionator addon's public API table.
[[allowlists]]
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''=\s*(?:[\w.]+\.)?Auctionator\.API\.v1\b''']
