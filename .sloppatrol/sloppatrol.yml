# Sloppatrol profile for SkillUp Forever, a WoW: Forever addon in Lua 5.1 with Python tooling.
# The checks are the fast ones from AGENTS.md, set by hand: the repo has no package.json to infer them from.
agent: claude
prepare: []
cleanup: [stylua .]
checks:
  - { name: format, run: "stylua --check ." }
  - { name: lint, run: "luacheck ." }
  - { name: typecheck, run: "tools/typecheck.sh" }
  - { name: specs, run: "for s in tests/*_spec.lua; do luajit \"$s\" || exit 1; done", tests: true }
  - { name: tools, run: "ruff format --check tools && ruff check tools" }
  - { name: generated, run: "python3 tools/check_generated.py --offline" }
  - { name: credits, run: "python3 tools/forever_tools/credits.py --check" }
focus: [Core/**, UI/**, Integrations/**]
ignore: [Data/**, Locales/**, Libs/**, tools/forever_tools/**]
guards: { maxFiles: 8, maxLines: 400 }
