<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>SkillUp Forever</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#3a2a1c"/>
      <stop offset="1" stop-color="#120c08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7a1"/>
      <stop offset="0.45" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#7a4f14"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.5" stop-color="#f2c14e"/>
      <stop offset="1" stop-color="#b3741c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="40" y="176" width="176" height="30" rx="4"/></clipPath>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="28" fill="url(#gold)"/>
  <rect x="16" y="16" width="224" height="224" rx="20" fill="url(#bg)"/>

  <!-- skill-up arrow -->
  <path d="M128 34 L196 108 H154 V156 H102 V108 H60 Z" fill="#000" opacity="0.45" transform="translate(4 5)"/>
  <path d="M128 34 L196 108 H154 V156 H102 V108 H60 Z" fill="url(#arrow)" stroke="#5a360c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M128 46 L180 102 H148 V110 H108 V102 H76 Z" fill="url(#shine)"/>

  <!-- difficulty bar: orange / yellow / green / grey -->
  <rect x="36" y="172" width="184" height="38" rx="7" fill="#000" opacity="0.8"/>
  <g clip-path="url(#barClip)">
    <rect x="40" y="176" width="44" height="30" fill="#ff8040"/>
    <rect x="84" y="176" width="44" height="30" fill="#ffff00"/>
    <rect x="128" y="176" width="44" height="30" fill="#40c040"/>
    <rect x="172" y="176" width="44" height="30" fill="#808080"/>
    <rect x="40" y="176" width="176" height="13" fill="url(#shine)"/>
  </g>
  <rect x="36" y="172" width="184" height="38" rx="7" fill="none" stroke="url(#gold)" stroke-width="4"/>
  <!-- your skill -->
  <rect x="104" y="164" width="7" height="54" rx="2" fill="#fff" stroke="#000" stroke-width="2.5"/>
</svg>
